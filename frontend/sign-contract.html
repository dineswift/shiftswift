<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./brand-config.js?v=brand-v5"></script>
    <script src="./app-host-guard.js?v=1"></script>
    <title>Sign contract | ShiftSwift HR</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon.png?v=brandkit-v1" />
    <link rel="stylesheet" href="./styles.css?v=brandkit-v1" />
    <style>
      .contract-preview {
        max-height: 420px;
        overflow: auto;
        border: 1px solid var(--gray-200);
        border-radius: var(--radius-md);
        padding: 20px;
        background: var(--white);
        font-size: 14px;
        line-height: 1.6;
      }
      .contract-preview h1 { font-size: 1.4rem; }
      .contract-preview h2 { font-size: 1.1rem; margin-top: 1rem; }
      .signature-pad-field {
        display: grid;
        gap: 8px;
      }
      .signature-pad-label {
        font-weight: 600;
      }
      .signature-pad-frame {
        position: relative;
        border: 1px solid var(--gray-300, #c5d0cb);
        border-radius: var(--radius-md, 10px);
        background:
          linear-gradient(to bottom, transparent calc(100% - 40px), #0F6E56 calc(100% - 40px), #0F6E56 calc(100% - 38px), transparent calc(100% - 38px)),
          #fbfdfc;
        overflow: hidden;
      }
      .signature-pad-placeholder {
        position: absolute;
        left: 18px;
        bottom: 48px;
        margin: 0;
        font-family: "Segoe Script", "Bradley Hand", "Comic Sans MS", cursive;
        font-size: 1.4rem;
        color: #9aaba4;
        pointer-events: none;
      }
      .signature-pad-frame.is-signed .signature-pad-placeholder {
        display: none;
      }
      #signature-pad {
        display: block;
        width: 100%;
        height: 180px;
        touch-action: none;
        cursor: crosshair;
        user-select: none;
        -webkit-user-select: none;
      }
      .signature-pad-actions {
        display: flex;
        justify-content: flex-end;
      }
    </style>
  </head>
  <body class="auth-body">
    <div class="setup-shell">
      <div class="auth-card">
        <a class="brand" href="./index.html">
          <img class="brand-logo" src="./assets/shiftswift-hr-logo-nav.svg?v=brandkit-v4" alt="ShiftSwift HR" />
        </a>
        <h1>Review & sign agreement</h1>
        <p class="muted" id="contract-meta">Loading contract…</p>
        <div id="contract-preview" class="contract-preview"></div>
        <form id="sign-form" class="stack" style="margin-top:16px;">
          <label>Your full name<input name="signature_name" required autocomplete="name" /></label>
          <div class="signature-pad-field">
            <span class="signature-pad-label" id="signature-pad-label">Handwritten signature</span>
            <p class="muted signature-pad-hint">Draw with your finger, mouse, or stylus on the line.</p>
            <div class="signature-pad-frame" id="signature-pad-frame">
              <p class="signature-pad-placeholder" id="signature-pad-placeholder">Sign here</p>
              <canvas id="signature-pad" width="640" height="180" role="img" aria-labelledby="signature-pad-label"></canvas>
            </div>
            <div class="signature-pad-actions">
              <button type="button" class="btn ghost" id="signature-pad-clear">Clear signature</button>
            </div>
          </div>
          <label>Job title<input name="signature_title" placeholder="Director" /></label>
          <label class="checkbox-row">
            <input type="checkbox" name="accept_terms" required />
            <span>I have read this agreement and sign on behalf of my organisation.</span>
          </label>
          <button class="btn" type="submit">Sign contract</button>
          <p id="sign-status" class="edit-form-status muted" aria-live="polite"></p>
        </form>
      </div>
    </div>
    <script src="./action-feedback.js?v=3"></script>
    <script src="./sign-contract.js?v=6"></script>
      <script src="./cookie-consent.js?v=1"></script>
  </body>
</html>
