<!doctype html>
<html lang="en" data-app-icon="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      if (new URLSearchParams(window.location.search).get("role") === "employee") {
        window.location.replace("./employee-forgot-password.html");
      }
    </script>
    <script src="./brand-config.js?v=brand-v7"></script>
    <script src="./app-host-guard.js?v=2"></script>
    <script src="./app-icons.js?v=brandkit-v6"></script>
    <title>ShiftSwift HR | Reset password</title>
    <link rel="stylesheet" href="./styles.css?v=brandkit-v7" />
  </head>
  <body class="portal-login-page" data-password-portal="hr">
    <div class="portal-login-shell">
      <header class="portal-login-brand">
        <a href="./business-login.html">
          <img
            class="portal-login-brand-logo app-mark app-mark--login"
            src="./assets/shiftswift-hr-app-icon-192.png?v=brandkit-v6"
            alt="ShiftSwift HR"
          />
        </a>
        <p class="portal-login-brand-copy">HR admin dashboard</p>
      </header>

      <section class="portal-login-card portal-login-card--business">
        <div class="portal-login-role-banner" role="status" aria-live="polite">
          <span class="portal-login-role-banner__pill">Business HR</span>
          <p class="portal-login-role-banner__copy">
            Reset the password for your HR admin account — not employee portal logins.
          </p>
        </div>

        <div class="portal-login-card-body">
          <div class="portal-login-card-head">
            <h1>Forgot password?</h1>
            <p class="portal-login-card-lead">
              Enter your HR account email and we will send a secure reset link (valid for 24 hours).
            </p>
          </div>

          <form id="forgot-password-form" class="portal-login-form">
            <label>
              Email
              <input name="email" type="email" required autocomplete="username" placeholder="hr@company.co.uk" />
            </label>
            <p id="forgot-status" class="form-error-message" hidden></p>
            <button class="btn portal-login-submit" type="submit">Send reset link</button>
          </form>

          <p class="portal-login-alt-note">
            Remembered it?
            <a class="portal-login-inline-link" id="forgot-back-link" href="./business-login.html">Back to business sign in</a>
          </p>
          <p class="portal-login-alt-note muted">
            Staff member?
            <a class="portal-login-inline-link" href="./employee-forgot-password.html">Employee password reset</a>
          </p>
        </div>
      </section>
    </div>
    <script src="./password-reset.js?v=5"></script>
    <script src="./cookie-consent.js?v=1"></script>
  </body>
</html>
